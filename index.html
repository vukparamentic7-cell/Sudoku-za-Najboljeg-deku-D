
<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku za deku</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        h1 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        #sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 45px);
            grid-template-rows: repeat(9, 45px);
            gap: 0;
            border: 3px solid #2c3e50;
            background-color: #2c3e50;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .cell {
            width: 45px;
            height: 45px;
            background-color: #ffffff;
            border: 1px solid #bdc3c7;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #2980b9;
            outline: none;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }

        .cell:focus {
            background-color: #ebf5fb;
        }

        .cell:disabled {
            background-color: #eaeded;
            color: #2c3e50;
            -webkit-text-fill-color: #2c3e50;
        }

        .cell.incorrect {
            background-color: #fadbd8;
            color: #c0392b;
            -webkit-text-fill-color: #c0392b;
        }

        .border-right {
            border-right: 2px solid #2c3e50 !important;
        }

        .border-bottom {
            border-bottom: 2px solid #2c3e50 !important;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: translateY(1px);
        }

        #message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <h1>Sudoku za deku</h1>
    <div id="sudoku-board"></div>
    
    <div class="controls">
        <button onclick="newGame()">Nova igra</button>
        <button onclick="checkGame()">Proveri</button>
        <button onclick="solveGame()">Reši</button>
    </div>

    <div id="message"></div>

    <script>
        const initialBoard = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0],
            [6, 0, 0, 1, 9, 5, 0, 0, 0],
            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 0, 0, 3],
            [4, 0, 0, 8, 0, 3, 0, 0, 1],
            [7, 0, 0, 0, 2, 0, 0, 0, 6],
            [0, 6, 0, 0, 0, 0, 2, 8, 0],
            [0, 0, 0, 4, 1, 9, 0, 0, 5],
            [0, 0, 0, 0, 8, 0, 0, 7, 9]
        ];

        const solutionBoard = [
            [5, 3, 4, 6, 7, 8, 9, 1, 2],
            [6, 7, 2, 1, 9, 5, 3, 4, 8],
            [1, 9, 8, 3, 4, 2, 5, 6, 7],
            [8, 5, 9, 7, 6, 1, 4, 2, 3],
            [4, 2, 6, 8, 5, 3, 7, 9, 1],
            [7, 1, 3, 9, 2, 4, 8, 5, 6],
            [9, 6, 1, 5, 3, 7, 2, 8, 4],
            [2, 8, 7, 4, 1, 9, 6, 3, 5],
            [3, 4, 5, 2, 8, 6, 1, 7, 9]
        ];

        function createBoard() {
            const boardContainer = document.getElementById('sudoku-board');
            boardContainer.innerHTML = '';

            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.className = 'cell';

                    if ((col + 1) % 3 === 0 && col !== 8) {
                        input.classList.add('border-right');
                    }
                    if ((row + 1) % 3 === 0 && row !== 8) {
                        input.classList.add('border-bottom');
                    }

                    const val = initialBoard[row][col];
                    if (val !== 0) {
                        input.value = val;
                        input.disabled = true;
                    }

                    input.addEventListener('input', (e) => {
                        const value = e.target.value;
                        if (!/^[1-9]?$/.test(value)) {
                            e.target.value = '';
                        }
                        input.classList.add('incorrect');
                    });

                    boardContainer.appendChild(input);
                }
            }
            document.getElementById('message').innerText = '';
        }

        function checkGame() {
            const inputs = document.querySelectorAll('.cell');
            let allCorrect = true;
            let isComplete = true;

            inputs.forEach((input, index) => {
                const row = Math.floor(index / 9);
                const col = index % 9;

                if (!input.disabled) {
                    const val = parseInt(input.value);
                    if (!val) {
                        isComplete = false;
                    } else if (val !== solutionBoard[row][col]) {
                        input.classList.1 = input.classList.add('incorrect');
                        allCorrect = false;
                    } else {
                        input.classList.remove('incorrect');
                    }
                }
            });

            const message = document.getElementById('message');
            if (!isComplete && allCorrect) {
                message.style.color = '#e67e22';
                message.innerText = 'Sve što je uneto do sada je tačno, ali tabla nije popunjena.';
            } else if (allCorrect && isComplete) {
                message.style.color = '#27ae60';
                message.innerText = 'Bravo! Uspešno si rešio Sudoku!';
            } else {
                message.style.color = '#c0392b';
                message.innerText = 'Ima grešaka. Označena polja nisu tačna.';
            }
        }

        function solveGame() {
            const inputs = document.querySelectorAll('.cell');
            inputs.forEach((input, index) => {
                const row = Math.floor(index / 9);
                const col = index % 9;
                input.value = solutionBoard[row][col];
                input.classList.remove('incorrect');
            });
            document.getElementById('message').style.color = '#2980b9';
            document.getElementById('message').innerText = 'Prikazano je rešenje.';
        }

        function newGame() {
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
